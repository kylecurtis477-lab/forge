# Same entry works as a /etc/grub.d/40_custom snippet on an existing Linux GRUB (dual boot):
#   copy kernel.elf to /boot/forge/kernel.elf and use: multiboot2 /boot/forge/kernel.elf
set timeout=0
set default=0
set gfxpayload=text
serial --unit=0 --speed=115200
terminal_output serial
menuentry "Forge kernel" {
    multiboot2 /boot/kernel.elf
    boot
}
